name: JARVIS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install backend dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest pytest-cov
    
    - name: Lint with flake8
      run: |
        cd backend
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run Python tests
      run: |
        cd backend
        pytest test_*.py --verbose --cov=. --cov-report=xml
      continue-on-error: true
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
      continue-on-error: true

  mobile-app-check:
    name: Mobile App Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ChatInterface/package-lock.json
    
    - name: Install dependencies
      run: |
        cd ChatInterface
        npm ci
    
    - name: Check for TypeScript errors
      run: |
        cd ChatInterface
        npx tsc --noEmit
      continue-on-error: true
    
    - name: Lint JavaScript/TypeScript
      run: |
        cd ChatInterface
        npm run lint
      continue-on-error: true

  security-check:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install safety
      run: pip install safety
      continue-on-error: true
    
    - name: Check for security vulnerabilities
      run: |
        cd backend
        safety check -r requirements.txt --json || true
      continue-on-error: true
    
    - name: Run Bandit security linter
      run: |
        pip install bandit
        cd backend
        bandit -r . -f json -o bandit-report.json || true
      continue-on-error: true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: backend/bandit-report.json
      continue-on-error: true

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install pylint
        cd backend
        pip install -r requirements.txt || true
      continue-on-error: true
    
    - name: Run Pylint
      run: |
        cd backend
        pylint *.py --exit-zero --output-format=json > pylint-report.json || true
      continue-on-error: true
    
    - name: Upload quality reports
      uses: actions/upload-artifact@v4
      with:
        name: quality-reports
        path: backend/pylint-report.json
      continue-on-error: true

  documentation-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Check for broken links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        config-file: '.github/markdown-link-check-config.json'
      continue-on-error: true
    
    - name: Check markdown formatting
      uses: nosborn/github-action-markdown-cli@v3.2.0
      with:
        files: .
        config_file: '.markdownlint.json'
      continue-on-error: true

  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [lint-and-test, mobile-app-check, security-check, code-quality]
    if: always()
    
    steps:
    - name: Check build status
      run: |
        echo "Lint and Test: ${{ needs.lint-and-test.result }}"
        echo "Mobile App: ${{ needs.mobile-app-check.result }}"
        echo "Security: ${{ needs.security-check.result }}"
        echo "Code Quality: ${{ needs.code-quality.result }}"
    
    - name: Report status
      run: |
        if [ "${{ needs.lint-and-test.result }}" == "failure" ]; then
          echo "⚠️ Tests failed"
        else
          echo "✅ All checks passed"
        fi
